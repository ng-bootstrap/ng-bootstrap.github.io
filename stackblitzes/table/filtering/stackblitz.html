    <input type="hidden" name="project[files][src/app/table-filtering.html]" value="&lt;p&gt;
	You can do filter table data, in this case with observables and our &lt;code&gt;NgbHighlight&lt;/code&gt; component used in
	Typeahead
&lt;/p&gt;

&lt;form&gt;
	&lt;div class=&#34;mb-3 row&#34;&gt;
		&lt;label for=&#34;table-filtering-search&#34; class=&#34;col-xs-3 col-sm-auto col-form-label&#34;&gt;Full text search:&lt;/label&gt;
		&lt;div class=&#34;col-xs-3 col-sm-auto&#34;&gt;
			&lt;input id=&#34;table-filtering-search&#34; class=&#34;form-control&#34; type=&#34;text&#34; [formControl]=&#34;filter&#34; /&gt;
		&lt;/div&gt;
	&lt;/div&gt;
&lt;/form&gt;

&lt;table class=&#34;table table-striped&#34;&gt;
	&lt;thead&gt;
		&lt;tr&gt;
			&lt;th scope=&#34;col&#34;&gt;#&lt;/th&gt;
			&lt;th scope=&#34;col&#34;&gt;Country&lt;/th&gt;
			&lt;th scope=&#34;col&#34;&gt;Area&lt;/th&gt;
			&lt;th scope=&#34;col&#34;&gt;Population&lt;/th&gt;
		&lt;/tr&gt;
	&lt;/thead&gt;
	&lt;tbody&gt;
		@for (country of countries$ | async; track country.name; let i = $index) {
			&lt;tr&gt;
				&lt;th scope=&#34;row&#34;&gt;{{ i + 1 }}&lt;/th&gt;
				&lt;td&gt;
					&lt;img
						[src]=&#34;&#39;https://upload.wikimedia.org/wikipedia/commons/&#39; + country.flag&#34;
						[alt]=&#34;&#39;The flag of &#39; + country.name&#34;
						class=&#34;me-2&#34;
						style=&#34;width: 20px&#34;
					/&gt;
					&lt;ngb-highlight [result]=&#34;country.name&#34; [term]=&#34;filter.value&#34; /&gt;
				&lt;/td&gt;
				&lt;td&gt;&lt;ngb-highlight [result]=&#34;country.area | number&#34; [term]=&#34;filter.value&#34; /&gt;&lt;/td&gt;
				&lt;td&gt;&lt;ngb-highlight [result]=&#34;country.population | number&#34; [term]=&#34;filter.value&#34; /&gt;&lt;/td&gt;
			&lt;/tr&gt;
		} @empty {
			&lt;tr&gt;
				&lt;td colspan=&#34;4&#34; style=&#34;text-align: center&#34;&gt;No countries found&lt;/td&gt;
			&lt;/tr&gt;
		}
	&lt;/tbody&gt;
&lt;/table&gt;

    <input type="hidden" name="project[files][src/app/table-filtering.ts]" value="import { Component, PipeTransform } from &#39;@angular/core&#39;;
import { AsyncPipe, DecimalPipe } from &#39;@angular/common&#39;;
import { FormControl, ReactiveFormsModule } from &#39;@angular/forms&#39;;

import { Observable } from &#39;rxjs&#39;;
import { map, startWith } from &#39;rxjs/operators&#39;;
import { NgbHighlight } from &#39;@ng-bootstrap/ng-bootstrap/typeahead&#39;;

interface Country {
	name: string;
	flag: string;
	area: number;
	population: number;
}

const COUNTRIES: Country[] = [
	{
		name: &#39;Russia&#39;,
		flag: &#39;f/f3/Flag_of_Russia.svg&#39;,
		area: 17075200,
		population: 146989754,
	},
	{
		name: &#39;Canada&#39;,
		flag: &#39;c/cf/Flag_of_Canada.svg&#39;,
		area: 9976140,
		population: 36624199,
	},
	{
		name: &#39;United States&#39;,
		flag: &#39;a/a4/Flag_of_the_United_States.svg&#39;,
		area: 9629091,
		population: 324459463,
	},
	{
		name: &#39;China&#39;,
		flag: &#39;f/fa/Flag_of_the_People%27s_Republic_of_China.svg&#39;,
		area: 9596960,
		population: 1409517397,
	},
];

function search(text: string, pipe: PipeTransform): Country[] {
	return COUNTRIES.filter((country) =&gt; {
		const term = text.toLowerCase();
		return (
			country.name.toLowerCase().includes(term) ||
			pipe.transform(country.area).includes(term) ||
			pipe.transform(country.population).includes(term)
		);
	});
}

@Component({
	selector: &#39;ngbd-table-filtering&#39;,
	imports: [DecimalPipe, AsyncPipe, ReactiveFormsModule, NgbHighlight],
	templateUrl: &#39;./table-filtering.html&#39;,
	providers: [DecimalPipe],
})
export class NgbdTableFiltering {
	countries$: Observable&lt;Country[]&gt;;
	filter = new FormControl(&#39;&#39;, { nonNullable: true });

	constructor(pipe: DecimalPipe) {
		this.countries$ = this.filter.valueChanges.pipe(
			startWith(&#39;&#39;),
			map((text) =&gt; search(text, pipe)),
		);
	}
}
